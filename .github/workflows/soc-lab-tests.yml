name: SOC Lab Tests

on:
  push:
    paths:
      - '01-soc-alert-triage-lab/**'
      - '.github/workflows/soc-lab-tests.yml'
  pull_request:
    paths:
      - '01-soc-alert-triage-lab/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s 01-soc-alert-triage-lab/tests -p 'test_*.py'
