name: CI

# Runs linting and test coverage on every push and pull request.
#
# Tailored for this repo's actual layout: numbered module folders
# (01-networking-fundamentals/, 02-linux-basics/, ... 20-honeypots/) plus a notes/
# folder — not a single src/ package. Each module may or may not contain Python
# code, tests, or its own requirements.txt depending on how far along it is.
#
# The workflow discovers what exists dynamically:
#   - Modules with no Python code yet are skipped, not failed.
#   - Any module that adds test_*.py / *_test.py files gets linted and
#     coverage-checked automatically — no workflow edits needed per module.
#   - Each module can ship its own requirements.txt (e.g. 09-siem-tools/requirements.txt);
#     all of them get installed, plus any root-level requirements*.txt.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint Python files across all module folders
        run: |
          PY_FILES=$(find . -type f -name "*.py" -not -path "./.git/*")
          if [ -z "$PY_FILES" ]; then
            echo "No Python files found in any module folder yet — nothing to lint."
            exit 0
          fi
          echo "Python files found:"
          echo "$PY_FILES"
          # Hard fail only on real errors (syntax errors / undefined names), wherever they live.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git
          # Full style pass — reported but non-blocking, since modules are at different maturity levels.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics --exclude=.git

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Install per-module dependencies
        run: |
          # Root-level requirements (shared/dev deps), if any.
          find . -maxdepth 1 -iname "requirements*.txt" -not -path "./.git/*" -print -exec pip install -r {} \;
          # Each module folder may declare its own dependencies, e.g. 09-siem-tools/requirements.txt.
          find . -mindepth 2 -maxdepth 2 -iname "requirements*.txt" -not -path "./.git/*" -print -exec pip install -r {} \;

      - name: Run tests with coverage across all modules
        run: |
          TEST_FILES=$(find . -type f \( -name "test_*.py" -o -name "*_test.py" \) -not -path "./.git/*")
          if [ -z "$TEST_FILES" ]; then
            echo "No test files found in any module folder yet."
            echo "Add test_*.py (or *_test.py) inside a module — e.g. 09-siem-tools/tests/test_parser.py — to enable coverage enforcement here."
            exit 0
          fi
          echo "Test files found:"
          echo "$TEST_FILES"
          set +e
          pytest --cov=. --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml --cov-fail-under=60
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 5 ]; then
            echo "Test files matched but pytest collected zero test cases — skipping the coverage gate."
            exit 0
          fi
          exit $STATUS

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
